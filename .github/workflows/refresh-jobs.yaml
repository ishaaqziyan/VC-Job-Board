name: Refresh live job postings

# Runs against main only — GitHub only fires `schedule` for the workflow
# file as it exists on the repo's default branch, regardless of what's on
# other branches. Push to main triggers deploy.yaml, so a successful
# refresh here republishes the site with no extra deploy step required.
on:
  workflow_dispatch:
  schedule:
    # 06:17 UTC daily. Off-the-hour so it isn't queued behind the stampede
    # of jobs everyone else schedules at :00.
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # WORKER_GITHUB_TOKEN in Doppler (project vc-jobs, config prd) — same
      # PAT the Cloudflare Worker uses (see worker/refresh-trigger.js and
      # .github/workflows/deploy-worker.yaml). Checking out with a PAT
      # instead of the default ambient GITHUB_TOKEN matters: GitHub's
      # anti-loop rule means a push made with the ambient token does NOT
      # trigger other workflows' `on: push`, so deploy.yaml would silently
      # never fire and the site would never pick up the refreshed data.
      - name: Fetch deploy credentials from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: vc-jobs
          doppler-config: prd

      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.doppler.outputs.WORKER_GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch live job postings
        run: node scripts/fetch-getro-jobs.mjs

      - name: Install dependencies
        run: npm ci

      # Validates the freshly-fetched data against the content-collection
      # schema before it's committed, so a malformed upstream API response
      # can't land on main and break the next deploy.
      - name: Build site (schema validation gate)
        run: npm run build

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- src/data/jobs.json; then
            echo "No job data changes; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/jobs.json
          git commit -m "chore: refresh live job postings"
          git push origin HEAD:main
