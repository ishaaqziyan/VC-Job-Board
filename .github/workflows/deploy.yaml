name: Deploy to ICP

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install icp-cli
        run: npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm

      # DFX_IDENTITY_PEM in Doppler (project vc-jobs, config prd) must be the
      # contents of a .pem file for an identity authorized against the
      # canister in .icp/data/mappings/ic.ids.json (see worker/README-style
      # comment in the static-site skill re: `icp canister call ... authorize`
      # as a lower-privilege alternative to full controller access).
      - name: Fetch deploy identity from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: vc-jobs
          doppler-config: prd

      - name: Import deploy identity
        run: |
          echo "${{ steps.doppler.outputs.DFX_IDENTITY_PEM }}" > identity.pem
          icp identity import github-actions --from-pem identity.pem --storage plaintext
          icp identity default github-actions
          rm identity.pem

      # This canister currently runs Juno's satellite Wasm, not a
      # certified-assets Wasm, so this first deploy is a full code
      # replacement, not an incremental sync. If icp-cli prompts
      # interactively for confirmation here, this step will hang/fail in CI —
      # run `icp deploy --help` locally to find the non-interactive
      # confirm/force flag for this version and add it here.
      - name: Deploy to ICP
        run: icp deploy -e ic vc_job_board --yes
